[package]
name = "prism-shell"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Prism Shell — the single-source UI tree for Studio. Renders through prism-ui-runtime (winit + femtovg native, wasm32 + webgl browser)."

[lib]
name = "prism_shell"
path = "src/lib.rs"

[[bin]]
name = "prism-shell"
path = "src/bin/native.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["prism-core/crdt", "prism-ui-runtime/femtovg"]
web = ["dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:getrandom", "uuid/js", "prism-ui-runtime/web"]

[dependencies]
prism-core = { path = "../prism-core" }
prism-builder = { path = "../prism-builder" }
prism-dock = { path = "../prism-dock" }
prism-ui-runtime = { path = "../prism-ui-runtime", default-features = false, features = ["html"] }

wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true, features = ["js"] }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
