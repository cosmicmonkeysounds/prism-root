[package]
name = "prism-shell"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Prism Shell — the single-source UI tree for Studio. Renders through prism-ui-runtime (winit + femtovg native, wasm32 + webgl browser)."

[lib]
name = "prism_shell"
path = "src/lib.rs"

[[bin]]
name = "prism-shell"
path = "src/bin/native.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["prism-core/crdt", "prism-ui-runtime/femtovg"]
web = ["dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:getrandom", "uuid/js", "prism-ui-runtime/web"]
# Phase 9 of `docs/dev/dioxus-inspiration.md`. Wraps the per-frame
# render walk in `subsecond::call` so a swapped-in `lower_ui` body
# patches in-place without dropping the `Surface` tree or the
# reactive `Owner` graph. Off by default because the subsecond
# runtime hook adds a small per-call indirection. `prism dev shell`
# turns it on when invoked with `--hot=subsecond`.
hot-reload = ["dep:subsecond"]

[dependencies]
prism-core = { path = "../prism-core" }
prism-builder = { path = "../prism-builder" }
prism-dock = { path = "../prism-dock" }
prism-ui-runtime = { path = "../prism-ui-runtime", default-features = false, features = ["html"] }

# Phase 9 — runtime hot-patching seam. Gated by the `hot-reload`
# feature; production builds drop the dep entirely.
subsecond = { workspace = true, optional = true }

wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true, features = ["js"] }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
