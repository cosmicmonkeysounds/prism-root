[package]
name = "prism-loom-runtime"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Runtime for the Loom storytelling language — compiles a parsed AST into a LoomDatabase bundle and drives the playhead + ledger + resolver. The playback engine behind `prism-loom-lsp` previews and the future Studio host."

[lib]
name = "prism_loom_runtime"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
indexmap = { workspace = true }
prism-core = { path = "../prism-core" }
