[package]
name = "prism-shell"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Prism Shell — the single-source UI tree for Studio. Renders through prism-ui-runtime (winit + femtovg native, wasm32 + webgl browser)."

[lib]
name = "prism_shell"
path = "src/lib.rs"

[[bin]]
name = "prism-shell"
path = "src/bin/native.rs"
required-features = ["native"]

[features]
default = ["native"]
# Wave 2.5 of `docs/dev/composable-builder-plan.md` — native file
# dialog seam. `rfd` is pulled only when `native` is on (i.e. not
# `wasm`); the trait method on `Vfs` has a default `Unsupported`
# return so wasm builds compile clean.
#
# The persistent-Luau runtime (`prism_core::luau_runtime`) compiles
# under `native` so desktop builds drive app `[entry] script` bodies
# end-to-end. The wasm32-unknown-unknown target can't pull in mlua
# (vendored Luau only builds against emscripten); the runtime feature
# therefore stays off in the `web` matrix.
native = ["prism-core/crdt", "prism-core/luau", "prism-ui-runtime/femtovg", "dep:rfd"]
web = ["dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:getrandom", "uuid/js", "prism-ui-runtime/web"]
# Phase 9 of `docs/dev/dioxus-inspiration.md`. Wraps the per-frame
# render walk in `subsecond::call` so a swapped-in `lower_ui` body
# patches in-place without dropping the `Surface` tree or the
# reactive `Owner` graph. Off by default because the subsecond
# runtime hook adds a small per-call indirection. `prism dev shell`
# turns it on when invoked with `--hot=subsecond`.
hot-reload = ["dep:subsecond"]

[dependencies]
prism-core = { path = "../prism-core" }
prism-builder = { path = "../prism-builder" }
prism-dock = { path = "../prism-dock" }
prism-ui-runtime = { path = "../prism-ui-runtime", default-features = false, features = ["html"] }
# **PRSS hot-reload** — `PrssFingerprintCache` + `PrssChange` ride
# alongside the existing template-watch substrate. Used by the
# shell's `Shell::observe_stylesheet_change` hot-reload consumer.
prism-ui-build = { path = "../prism-ui-build" }

# Phase 9 — runtime hot-patching seam. Gated by the `hot-reload`
# feature; production builds drop the dep entirely.
subsecond = { workspace = true, optional = true }

wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true, features = ["js"] }

# Native file-picker / save-as dialogs. Gated by the `native`
# feature — wasm never pulls this in. Consumed by `OsVfs::pick_file`
# (Wave 2.5 — file-button browse) and queued for `file.save-as` /
# `file.open` plumbing in the persistence service.
rfd = { workspace = true, optional = true }

# Wave 7.2 of `docs/dev/composable-builder-plan.md` — PNG headless
# capture sink. The shell's `dump_png` walks the `RenderCommand`
# stream and writes RGBA via the workspace `image` crate (which
# pins `png` + `jpeg` features only — no decoder bloat). No GL
# context required, so the encoder works in CI and on wasm
# (when the trait gate lifts).
image = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = "3"
