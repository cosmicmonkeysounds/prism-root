[package]
name = "clay-layout"
version = "0.4.0-prism"
edition = "2021"
build = "build.rs"
description = "Vendored Prism fork of the Clay (https://github.com/nicbarker/clay) Rust binding."
license-file = "LICENSE.md"
repository = "https://github.com/clay-ui-rs/clay"
keywords = ["clay", "ui", "layout", "bindings"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

# Forked from clay-layout 0.4.0 @ https://github.com/clay-ui-rs/clay
# per ADR-008 + docs/dev/clay-migration-plan.md. Upstream renderer
# integrations (raylib / skia / wgpu examples) are stripped — Prism
# routes Clay's render commands through its own
# `prism-ui-runtime` backends.

[features]
default = ["std"]
std = []
wasm = []
debug = []

[lib]
name = "clay_layout"
path = "src/lib.rs"

[build-dependencies]
cc = "1.0"
