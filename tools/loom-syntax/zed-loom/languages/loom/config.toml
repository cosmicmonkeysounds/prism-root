name = "Loom"
grammar = "loom"
path_suffixes = ["loom"]
line_comments = ["// "]
block_comment = ["/*", "*/"]

# Auto-close pairs match the structural sigils from
# docs/dev/loom-grammar.md §3 — strings, backlinks, inline eval, and
# block braces.
brackets = [
  { start = "{",   end = "}",   close = true,  newline = true  },
  { start = "[",   end = "]",   close = true,  newline = true  },
  { start = "(",   end = ")",   close = true,  newline = true  },
  { start = "[[",  end = "]]",  close = true,  newline = false },
  { start = "${",  end = "}",   close = true,  newline = false },
  { start = "$(",  end = ")",   close = true,  newline = false },
  { start = "\"",  end = "\"",  close = true,  newline = false },
]

# Per docs/dev/loom-grammar.md §2 — words include ASCII letters,
# digits, and underscores. (SPEAKER vs. identifier is a positional
# distinction made by the grammar, not the word-pattern.)
word_characters = ["_"]

# Indent / outdent triggers. The full indent rules live in the
# (future) tree-sitter grammar; this is the editor's best-effort
# fallback when the LSP / tree-sitter grammar isn't loaded.
indent_size = 2
hard_tabs = false
