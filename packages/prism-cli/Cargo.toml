[package]
name = "prism-cli"
version = "0.1.0"
edition = "2021"
description = "Prism Framework CLI — unified entry point for testing, building, and running every Prism package. Wraps cargo, trunk, and pnpm behind a single `prism` binary with a process supervisor for `prism dev all`."

[lib]
name = "prism_cli"
path = "src/lib.rs"

[[bin]]
name = "prism"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "process", "signal", "time"] }
# Filesystem watcher — drives the Phase 1 notify-driven dev-server
# scaffold (`watch` module). Receives events on a background thread
# and debounces them before handing them to the dev server for
# rebuild decisions.
notify = { workspace = true }
# `prism codegen luau-types` walks the workspace's `#[luau_expose]`
# annotations through `prism-core`'s + `prism-builder`'s curated
# registries. `prism scripts validate` additionally drives the
# `prism_builder::load_*` script preflight pipelines, which need
# `prism-builder/luau` (pulls in `mlua` for the compile-only pass).
# `prism-builder` also exposes the per-component signal stub generator
# (`generate_signal_type_stubs`), which the codegen subcommand fans out
# alongside the type registry.
prism-core = { path = "../prism-core" }
prism-builder = { path = "../prism-builder", features = ["luau"] }
# `prism scripts run` invokes a project script through the daemon's
# `luau_module::exec` so the `prism` global is installed identically
# to live execution. `default-features = false` keeps the heavyweight
# modules (whisper / vfs / watcher / actors / conferencing) out of
# the CLI's build.
prism-daemon = { path = "../prism-daemon", default-features = false, features = ["luau"] }
# `.prism.json` parsing — `prism scripts validate` reads the manifest's
# `scripts` section and dispatches to the matching loader.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `prism codegen luau-types` also walks the runtime's value-type
# registry to emit `prism-ui.d.luau` (clay-migration-plan.md §4.8).
# Default features (HTML SSR only) keep the dep graph cheap — no
# winit / femtovg / cosmic-text are pulled in for a CLI build.
prism-ui-runtime = { path = "../prism-ui-runtime" }
# `prism loom lsp` runs the Loom Language Server Protocol
# implementation in-process. Pulled here so the CLI binary itself
# can host the server without spawning the separate
# `prism-loom-lsp` binary — useful for editors (Zed, …) that
# accept any command line as their language-server launcher.
prism-loom-lsp = { path = "../prism-loom-lsp" }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
