# ─────────────────────────────────────────────────────────────────────
# Linker (opt-in). A faster linker meaningfully cuts incremental build
# time on the big femtovg/winit/glutin/studio binaries. It is
# DELIBERATELY NOT enabled here by default:
#
#   This file is read by EVERY cargo invocation (raw `cargo`, the
#   `prism` CLI, and rust-analyzer alike). Anything we put here is
#   applied uniformly, so it never causes the "switch tools → full
#   recompile" fingerprint thrash that a CLI-only RUSTFLAGS override
#   does. The flip side: the rustup-bundled `ld64.lld` lives at a
#   per-machine sysroot path we can't hardcode in a committed file.
#
# To turn lld on consistently for everyone on your machine, install a
# PATH-visible lld once (so the fingerprint is identical across CLI,
# raw cargo, and the IDE) and uncomment the matching block:
#
#   macOS (Apple Silicon already ships a fast default `ld`; lld is a
#   marginal win there — measure before bothering):
#     brew install llvm
#     [target.aarch64-apple-darwin]
#     rustflags = ["-C", "link-arg=-fuse-ld=lld"]
#
#   Linux:
#     # apt install lld   (or distro equivalent)
#     [target.x86_64-unknown-linux-gnu]
#     rustflags = ["-C", "link-arg=-fuse-ld=lld"]
#
# `sccache` is wired separately by the `prism` CLI (see
# `packages/prism-cli/src/accel.rs`) because RUSTC_WRAPPER does not
# affect the artifact fingerprint and so cannot cause recompile thrash.
# ─────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────
# WebAssembly stack size. LLD defaults the wasm shadow stack to 1 MiB.
# The Loom play engine (recursive playhead lowering + reactive `let`
# evaluation + scheduler) and the prism-shell UI tree both recurse
# deep enough that an *unoptimised* (`--dev` / debug) wasm build — whose
# stack frames are far larger than release — overflows that 1 MiB and
# traps with "memory access out of bounds" mid-play. Release frames fit,
# so this never bit production, only the `wasm:build:dev` fast-iteration
# bundle. Reserve 16 MiB so both profiles have ample headroom. Committed
# here (not CLI-injected) so every wasm build — wasm-pack, raw cargo —
# sees the identical flag; rust-analyzer never targets wasm32, so this
# causes no native-target fingerprint thrash.
# ─────────────────────────────────────────────────────────────────────
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=16777216"]

[alias]
# Quality-of-life shortcuts for the Rust half of the monorepo.
#
# `prism` is the unified front door. This alias makes `cargo prism …`
# work with ZERO setup for anyone who clones (this file is committed),
# so a missing global `prism` binary never blocks the dev loop:
#
#   cargo prism dev shell
#   cargo prism build
#   cargo prism test
#
# For a bare `prism` (no `cargo ` prefix) on PATH, run once:
#   cargo install --path packages/prism-cli      (or: scripts/install-cli.sh)
prism = "run -q -p prism-cli --"
shell-web = "run -p prism-shell --target wasm32-unknown-unknown"
shell-dev = "run -p prism-shell"
xtest = "test --workspace --exclude prism-studio"
