[package]
name = "tree-sitter-loom"
description = "Loom grammar for tree-sitter"
version = "0.1.0"
authors = ["Prism Framework"]
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "loom"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/prism-framework/prism"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"
