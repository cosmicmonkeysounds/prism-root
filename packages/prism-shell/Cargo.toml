[package]
name = "prism-shell"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Prism Shell — the single-source UI tree for Studio. Renders through prism-ui-runtime (winit + femtovg native, wasm32 + webgl browser)."

[lib]
name = "prism_shell"
path = "src/lib.rs"

[[bin]]
name = "prism-shell"
path = "src/bin/native.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["dep:prism-daemon", "dep:rfd", "dep:mlua", "prism-core/crdt", "prism-ui-runtime/femtovg"]
web = ["dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:getrandom", "uuid/js", "prism-ui-runtime/web"]
e2e = ["dep:image", "dep:enigo"]

[dependencies]
prism-core = { path = "../prism-core" }
prism-builder = { path = "../prism-builder", features = ["interpreter"] }
prism-dock = { path = "../prism-dock" }
prism-ui-runtime = { path = "../prism-ui-runtime", default-features = false, features = ["html"] }
prism-luau-derive = { workspace = true }

prism-daemon = { path = "../prism-daemon", optional = true, default-features = false, features = ["crdt", "luau", "vfs", "crypto"] }

mlua = { workspace = true, optional = true }

wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true, features = ["js"] }

clap = { version = "4", features = ["derive"] }

image = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
enigo = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
