[package]
name = "loom-lsp"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Language Server Protocol server for Loom v3. Speaks JSON-RPC over stdio; backed by loom-parser + a workspace-wide name index."

[lib]
name = "loom_lsp"
path = "src/lib.rs"

[[bin]]
name = "loom-lsp"
path = "src/bin/loom-lsp.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
loom-parser = { path = "../parser" }
