[package]
name = "prism-ui-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Prism UI runtime — Taffy-backed layout + pluggable backends (femtovg native, web canvas, HTML SSR)"

# This crate ships under MIT OR Apache-2.0 from day one to mark the
# Slint→Clay licence boundary. The rest of the workspace stays on
# GPL-3.0-or-later until Phase 5 cutover (see ADR-008 + the Phase 0
# decision in `docs/dev/clay-migration-plan.md`).

[features]
default = ["html"]
# Native: winit + glutin + femtovg + cosmic-text. Pulled directly;
# replaces the bundled Slint backend.
femtovg = [
    "dep:femtovg",
    "dep:cosmic-text",
    "dep:winit",
    "dep:glutin",
    "dep:glutin-winit",
    "dep:raw-window-handle",
    "dep:image",
    "dep:resvg",
]
# Web: winit-on-wasm + WebGL2 (femtovg's OpenGl renderer over a
# `<canvas>`-derived context).
web = [
    "dep:femtovg",
    "dep:cosmic-text",
    "dep:winit",
    "dep:raw-window-handle",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:js-sys",
    "dep:console_error_panic_hook",
    "dep:image",
    "dep:resvg",
]
# SSR: pure render-command → HTML/CSS lowering. No event loop.
# Always-on for `prism-relay`; default-on so a host pulling
# `prism-ui-runtime` for SSR alone gets it for free.
html = []
# Luau bindings — exposes `Node`, `Surface`, and a `ui.*` constructor
# table to Luau via `mlua::UserData`. Off by default so the relay's
# HTML SSR path stays mlua-free; flipped on by `prism-shell` and any
# host that wants Luau-authored components (see
# clay-migration-plan.md §11).
luau = ["dep:mlua", "prism-core/luau"]

[dependencies]
prism-core = { path = "../prism-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
# Pivot 2026-05-04: layout engine is Taffy, not Clay (see the pivot
# note at the top of `docs/dev/clay-migration-plan.md`). Pure Rust,
# no FFI, already used by `prism-builder` for the editor's grid
# layout pass — adopting it here unifies the two.
taffy = { workspace = true }
mlua = { workspace = true, optional = true }

# Native + web rendering stack. All four are optional and pulled by
# the `femtovg` / `web` features. `femtovg` ships its own text engine
# (rustybuzz) but we deliberately turn that off and route shaping
# through `cosmic-text` per the plan's text rendering contract
# (clay-migration-plan.md §5.3 + §7.2).
femtovg = { workspace = true, optional = true }
cosmic-text = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }

# Image decoders for `RenderCommand::Image` — PNG / JPEG through the
# `image` crate (already in the workspace for screenshot diffing),
# SVG through resvg. Both are pulled by the rendering features only;
# the HTML / SSR path doesn't decode raster images.
image = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }

# Native-only.
glutin = { workspace = true, optional = true }
glutin-winit = { workspace = true, optional = true }

# Web-only.
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[dependencies.web-sys]
workspace = true
optional = true
features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    "WebGl2RenderingContext",
    # `Window::performance()` returns `Option<Performance>`; the
    # method itself is gated behind the `Performance` feature in
    # web-sys 0.3. The femtovg backend reads `performance.now()`
    # for the animated-image frame clock (Wave 14.7).
    "Performance",
]

[dev-dependencies]
insta = { workspace = true }
# Scratch directory for `images::filesystem_loader` tests — writes a
# fixture file under the OS temp root and points the loader at it.
tempfile = { workspace = true }
