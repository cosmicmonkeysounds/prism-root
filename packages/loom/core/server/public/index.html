<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Escape the Internet</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #151922;
        --panel2: #1d2330;
        --ink: #e7ecf3;
        --muted: #8b95a7;
        --mods: #4ea1ff;
        --chatters: #ff5fa2;
        --algo: #b06bff;
        --good: #39d98a;
        --bad: #ff6b6b;
        --line: #2a3140;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: rgba(11, 13, 18, 0.92);
        backdrop-filter: blur(6px);
        z-index: 10;
      }
      header h1 { font-size: 16px; margin: 0; letter-spacing: 0.2px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; margin-right: 6px; }
      .dot.on { background: var(--good); }
      main { max-width: 720px; margin: 0 auto; padding: 16px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
      .card h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
      button {
        font: inherit; font-weight: 600; color: var(--ink); background: var(--panel2);
        border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; cursor: pointer;
        width: 100%; margin-top: 8px; transition: transform 0.05s, background 0.15s;
      }
      button:active { transform: scale(0.98); }
      button.primary { background: var(--mods); border-color: var(--mods); color: #06121f; }
      button.ghost { background: transparent; }
      button.row { width: auto; display: inline-block; margin: 4px 6px 0 0; padding: 8px 12px; }
      input, select {
        font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line);
        border-radius: 12px; padding: 12px 14px; width: 100%; margin-top: 8px;
      }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat { background: var(--panel2); border-radius: 12px; padding: 12px; }
      .stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
      .stat .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
      .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
      .pill.Mods { background: rgba(78,161,255,0.18); color: var(--mods); }
      .pill.Chatters { background: rgba(255,95,162,0.18); color: var(--chatters); }
      .pill.TheAlgorithm { background: rgba(176,107,255,0.18); color: var(--algo); }
      .pill.none { background: #232a37; color: var(--muted); }
      .muted { color: var(--muted); }
      .feed { max-height: 320px; overflow-y: auto; }
      .feed .item { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
      .feed .item:last-child { border-bottom: none; }
      .toast { background: var(--panel2); border-left: 3px solid var(--algo); padding: 10px 12px; border-radius: 8px; margin-top: 8px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
      .qr { background: #fff; border-radius: 12px; padding: 10px; width: 200px; margin: 8px auto; }
      .qr img { display: block; width: 100%; }
      .bigid { font-size: 26px; font-weight: 800; letter-spacing: 2px; text-align: center; }
      .roles { display: grid; gap: 12px; margin-top: 24px; }
      .roles button { padding: 22px; font-size: 18px; }
      .captured { color: var(--bad); font-weight: 700; }
      .right { text-align: right; }
      .err { color: var(--bad); font-size: 14px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>🌐 Escape the Internet</h1>
      <span id="status"><span class="dot"></span><span class="muted" id="status-label">offline</span></span>
    </header>
    <main id="app"></main>

    <script>
      const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
      const app = document.getElementById("app");
      const ls = {
        get: (k) => { try { return JSON.parse(localStorage.getItem("loom_" + k)); } catch { return null; } },
        set: (k, v) => localStorage.setItem("loom_" + k, JSON.stringify(v)),
        del: (k) => localStorage.removeItem("loom_" + k),
      };
      function setStatus(on, label) {
        document.querySelector("#status .dot").classList.toggle("on", on);
        document.getElementById("status-label").textContent = label;
      }
      // Served at "/console" (the default event) or "/e/:eventId/console".
      // In the latter case, scope every API call + the SSE stream to that event.
      const _evm = location.pathname.match(/^\/e\/([^/]+)\/console\/?$/);
      const BASE = _evm ? "/e/" + _evm[1] : "";
      async function api(path, body, token) {
        const r = await fetch(BASE + path, {
          method: "POST",
          headers: { "content-type": "application/json", ...(token ? { "x-loom-token": token } : {}) },
          body: JSON.stringify(body || {}),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
        return data;
      }
      let es = null;
      function stream(role, id, handlers) {
        if (es) es.close();
        es = new EventSource(`${BASE}/events?role=${role}&id=${encodeURIComponent(id || "")}`);
        es.onopen = () => setStatus(true, role);
        es.onerror = () => setStatus(false, "reconnecting…");
        for (const [name, fn] of Object.entries(handlers)) es.addEventListener(name, (e) => fn(JSON.parse(e.data)));
      }
      const pill = (f) => `<span class="pill ${f || "none"}">${f || "unaligned"}</span>`;
      const codeFromUrl = () => { try { return new URLSearchParams(location.search).get("code") || ""; } catch { return ""; } };

      // ---------------- role chooser ----------------
      function chooser() {
        if (es) es.close();
        setStatus(false, "offline");
        app.innerHTML = "";
        app.append($(`
          <div>
            <div class="card"><h2>Who are you?</h2>
              <div class="roles">
                <button class="primary" data-role="guest">🎟️ I'm a Guest</button>
                <button data-role="prime">🎭 I'm a Performer</button>
                <button class="ghost" data-role="mod">🛡️ I'm a Moderator</button>
              </div>
            </div>
          </div>`));
        app.querySelectorAll("[data-role]").forEach((b) =>
          b.onclick = () => ({ guest: guestFlow, prime: primeFlow, mod: modFlow })[b.dataset.role]());
      }

      const switchBtn = (fn) => { const b = $(`<button class="ghost" style="margin-top:18px">↩︎ Switch role</button>`); b.onclick = () => { fn(); chooser(); }; return b; };

      // ---------------- GUEST ----------------
      function guestFlow() {
        const saved = ls.get("guest");
        if (saved && saved.id) return guestDash(saved);
        app.innerHTML = "";
        const err = $(`<div class="err"></div>`);
        const card = $(`
          <div class="card"><h2>Join the event</h2>
            <p class="muted">Pick a name and enter the event code from the host. You'll get a QR code that performers can scan.</p>
            <input id="gname" placeholder="Your name" autocomplete="off" />
            <input id="gcode" placeholder="Event code" autocomplete="off" autocapitalize="characters" spellcheck="false" />
            <button class="primary" id="gjoin">Enter the internet →</button>
          </div>`);
        card.querySelector("#gcode").value = codeFromUrl();
        card.append(err);
        app.append(card, switchBtn(() => {}));
        card.querySelector("#gjoin").onclick = async () => {
          try {
            const name = card.querySelector("#gname").value.trim() || "Guest";
            const passcode = card.querySelector("#gcode").value.trim();
            const r = await api("/api/guest/register", { name, passcode });
            ls.set("guest", r);
            guestDash(r);
          } catch (e) { err.textContent = e.message; }
        };
      }
      function guestDash(me) {
        app.innerHTML = "";
        const notif = $(`<div class="feed"></div>`);
        const body = $(`<div></div>`);
        const wrap = $(`<div></div>`);
        wrap.append(body, $(`<div class="card"><h2>Signals</h2></div>`));
        wrap.querySelector(".card").append(notif);
        const leave = switchBtn(() => ls.del("guest"));
        app.append(wrap, leave);
        const pushNote = (txt) => { notif.prepend($(`<div class="toast">${txt}</div>`)); };

        const render = (v) => {
          body.innerHTML = "";
          const status = $(`
            <div class="card">
              <h2>Your status</h2>
              <div class="grid">
                <div class="stat"><div class="k">Faction</div><div class="v">${pill(v.faction)}</div></div>
                <div class="stat"><div class="k">Score</div><div class="v">${v.score}</div></div>
                <div class="stat"><div class="k">Location</div><div class="v">${v.location || "—"}</div></div>
                <div class="stat"><div class="k">State</div><div class="v">${v.captured ? '<span class="captured">CAPTURED</span>' : "free"}</div></div>
              </div>
            </div>`);
          body.append(status);

          if (!v.faction) {
            const fc = $(`<div class="card"><h2>Choose your side</h2></div>`);
            ["Mods", "Chatters"].forEach((f) => {
              const b = $(`<button>${f}</button>`); b.onclick = () => api("/api/guest/join", { id: me.id, faction: f }).catch((e) => pushNote(e.message));
              fc.append(b);
            });
            body.append(fc);
          } else {
            const fc = $(`<div class="card"><h2>Allegiance</h2><p class="muted">You stand with ${v.faction}.</p></div>`);
            const other = v.faction === "Mods" ? "Chatters" : "Mods";
            const b = $(`<button class="ghost">Defect to ${other}</button>`); b.onclick = () => api("/api/guest/defect", { id: me.id, to: other }).catch((e) => pushNote(e.message));
            fc.append(b);
            body.append(fc);
          }

          if (v.pendingChoice) {
            const ch = $(`<div class="card"><h2>Make a choice</h2></div>`);
            v.pendingChoice.forEach((opt, i) => {
              const b = $(`<button class="primary">${opt}</button>`);
              b.onclick = () => api("/api/guest/choose", { id: me.id, index: i }).catch((e) => pushNote(e.message));
              ch.append(b);
            });
            body.append(ch);
          }

          const qr = $(`
            <div class="card"><h2>Your pass</h2>
              <div class="qr"><img src="/api/qr?text=${encodeURIComponent(me.id)}" alt="QR" /></div>
              <div class="bigid">${me.id}</div>
              <p class="muted" style="text-align:center">Show this to a performer to be scanned.</p>
            </div>`);
          body.append(qr);
        };

        stream("guest", me.id, {
          snapshot: render,
          notify: (d) => pushNote("📣 " + d.cue),
          line: (d) => pushNote(`<b>${d.speaker}</b>: ${d.text}`),
          choice: () => {},
          reveal: (d) => pushNote("⚠️ <b>" + d.faction + "</b> has been exposed!"),
        });
      }

      // ---------------- PERFORMER ----------------
      function primeFlow() {
        const saved = ls.get("prime");
        if (saved && saved.token) return primeDash(saved);
        app.innerHTML = "";
        const err = $(`<div class="err"></div>`);
        const card = $(`
          <div class="card"><h2>Performer sign-in</h2>
            <input id="pchar" placeholder="Your character (e.g. Moderator_Prime)" autocomplete="off" />
            <input id="ppass" type="password" placeholder="Backstage passcode" />
            <button class="primary" id="plogin">Sign in</button>
          </div>`);
        card.append(err);
        app.append(card, switchBtn(() => {}));
        card.querySelector("#plogin").onclick = async () => {
          try {
            const r = await api("/api/prime/login", { character: card.querySelector("#pchar").value.trim(), passcode: card.querySelector("#ppass").value });
            ls.set("prime", r); primeDash(r);
          } catch (e) { err.textContent = e.message; }
        };
      }
      function primeDash(me) {
        app.innerHTML = "";
        const resp = $(`<div class="feed"></div>`);
        const guests = $(`<div></div>`);
        const scanErr = $(`<div class="err"></div>`);
        const card = $(`
          <div class="card"><h2>Scan a guest — ${me.character}</h2>
            <input id="scanid" placeholder="Guest id (e.g. g-1a2b3c)" autocomplete="off" />
            <button class="primary" id="scanbtn">Scan</button>
            <button class="ghost" id="cambtn">📷 Use camera</button>
          </div>`);
        card.append(scanErr);
        const doScan = (target) => api("/api/scan", { target }, me.token).catch((e) => (scanErr.textContent = e.message));
        card.querySelector("#scanbtn").onclick = () => doScan(card.querySelector("#scanid").value.trim());
        card.querySelector("#cambtn").onclick = () => startCamera(doScan, scanErr);
        app.append(card,
          $(`<div class="card"><h2>Scan response</h2></div>`),
          $(`<div class="card"><h2>Guests present</h2></div>`),
          switchBtn(() => ls.del("prime")));
        app.querySelectorAll(".card")[1].append(resp);
        app.querySelectorAll(".card")[2].append(guests);

        const render = (v) => {
          guests.innerHTML = "";
          if (!v.guests.length) guests.append($(`<p class="muted">No guests yet.</p>`));
          v.guests.forEach((g) => {
            const b = $(`<button class="row">${g.name} ${g.captured ? "🔒" : ""} <span class="muted">${g.id}</span></button>`);
            b.onclick = () => doScan(g.id);
            guests.append(b);
          });
        };
        stream("prime", me.character, {
          snapshot: render,
          response: (d) => resp.prepend($(`<div class="item">🖥️ ${d.text}</div>`)),
        });
      }
      async function startCamera(onCode, errEl) {
        if (!("BarcodeDetector" in window)) { errEl.textContent = "Camera scanning not supported — type the id."; return; }
        try {
          const det = new BarcodeDetector({ formats: ["qr_code"] });
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          const v = document.createElement("video"); v.srcObject = stream; v.setAttribute("playsinline", ""); await v.play();
          const card = $(`<div class="card"><h2>Point at a guest's QR</h2></div>`); card.append(v); v.style.width = "100%"; v.style.borderRadius = "12px";
          app.prepend(card);
          const tick = async () => {
            try { const codes = await det.detect(v); if (codes[0]) { stream.getTracks().forEach((t) => t.stop()); card.remove(); onCode(codes[0].rawValue); return; } } catch {}
            requestAnimationFrame(tick);
          };
          tick();
        } catch (e) { errEl.textContent = "Camera error: " + e.message; }
      }

      // ---------------- MODERATOR ----------------
      function modFlow() {
        const saved = ls.get("mod");
        if (saved && saved.token) return modDash(saved);
        app.innerHTML = "";
        const err = $(`<div class="err"></div>`);
        const card = $(`<div class="card"><h2>Moderator sign-in</h2>
          <input id="mpass" type="password" placeholder="Moderator passcode" />
          <button class="primary" id="mlogin">Sign in</button>
          <p class="muted" style="margin-top:10px">Find the moderator passcode in the <b>server's terminal</b> (printed at startup), or in <code>&lt;state-dir&gt;/codes.json</code>. You only need it once — after signing in, the console shows every code.</p>
        </div>`);
        card.append(err);
        app.append(card, switchBtn(() => {}));
        card.querySelector("#mlogin").onclick = async () => {
          try { const r = await api("/api/mod/login", { passcode: card.querySelector("#mpass").value }); ls.set("mod", r); modDash(r); }
          catch (e) { err.textContent = e.message; }
        };
      }
      function modDash(me) {
        app.innerHTML = "";
        const T = me.token;
        const ctrl = $(`<div class="card"><h2>Runtime</h2><div id="phase"></div></div>`);
        const btns = $(`<div></div>`);
        ["start", "stop", "reset"].forEach((a) => {
          const b = $(`<button class="${a === "start" ? "primary" : "ghost"} row">${a}</button>`);
          b.onclick = () => api("/api/mod/" + a, {}, T).catch(alertErr);
          btns.append(b);
        });
        ctrl.append(btns);

        const tools = $(`<div class="card"><h2>Operator tools</h2>
          <input id="sig" placeholder="Signal name (e.g. lockdown)" />
          <button class="row" id="sigbtn">Fire signal</button>
          <div style="height:10px"></div>
          <input id="bcue" placeholder="Broadcast cue (e.g. intermission)" />
          <input id="bscope" placeholder="Scope (e.g. faction(Mods))" />
          <button class="row" id="bbtn">Broadcast</button></div>`);
        tools.querySelector("#sigbtn").onclick = () => api("/api/mod/signal", { name: tools.querySelector("#sig").value.trim() }, T).catch(alertErr);
        tools.querySelector("#bbtn").onclick = () => api("/api/mod/broadcast", { cue: tools.querySelector("#bcue").value.trim(), scope: tools.querySelector("#bscope").value.trim() }, T).catch(alertErr);

        // Headless-admin scanner: scan a guest's QR to moderate them, or
        // scan *as* a character to fire that character's story beat.
        const scan = $(`<div class="card"><h2>Scan a guest</h2>
          <select id="mscanas"><option value="">Silent — moderate only</option></select>
          <input id="mscan" placeholder="Guest id (e.g. g-1a2b3c)" autocomplete="off" />
          <button class="primary row" id="mscanbtn">Scan</button>
          <button class="ghost row" id="mcambtn">📷 Use camera</button>
          <div id="mscanout"></div>
          <div class="err" id="mscanerr"></div></div>`);
        const scanErr = scan.querySelector("#mscanerr");
        const renderScanned = (g, responses) => {
          const out = scan.querySelector("#mscanout");
          out.innerHTML = "";
          if (!g) return;
          out.append($(`<div class="stat" style="margin-top:10px"><div><b>${g.name}</b> <span class="muted">${g.id}</span> ${pill(g.trueFaction)} ${g.captured ? '🔒 <span class="captured">captured</span>' : ""}</div></div>`));
          // Echo what the scanned-as character "says" back (the respond line).
          for (const line of responses || []) out.append($(`<div class="toast" style="margin-top:8px">🖥️ ${line}</div>`));
          const act = (action, name) => api("/api/mod/act", { id: g.id, action, name }, T).then((r) => renderScanned(r.guest)).catch((e) => (scanErr.textContent = e.message));
          const acts = $(`<div></div>`);
          const mk = (label, action, cls) => { const b = $(`<button class="row ${cls || ""}">${label}</button>`); b.onclick = () => act(action); acts.append(b); };
          if (g.captured) mk("Release", "release", "primary"); else mk("Capture", "capture", "");
          out.append(acts);
          const sig = $(`<div style="margin-top:8px"><input id="gsig" placeholder="Signal name (e.g. recruit)" /><button class="row" id="gsigbtn">Fire on this guest</button></div>`);
          sig.querySelector("#gsigbtn").onclick = () => act("signal", sig.querySelector("#gsig").value.trim());
          out.append(sig);
        };
        const doMScan = (target) => { scanErr.textContent = ""; if (target) api("/api/scan", { target, as: scan.querySelector("#mscanas").value }, T).then((r) => renderScanned(r.guest, r.responses)).catch((e) => (scanErr.textContent = e.message)); };
        scan.querySelector("#mscanbtn").onclick = () => doMScan(scan.querySelector("#mscan").value.trim());
        scan.querySelector("#mcambtn").onclick = () => startCamera(doMScan, scanErr);

        const roster = $(`<div class="card"><h2>Roster</h2><div id="rost"></div></div>`);
        const world = $(`<div class="card"><h2>Factions & locations</h2><div id="wld"></div></div>`);

        // Always render *fresh* codes from the server — a cached login can
        // be stale, and the server knows the LAN URL the join QR needs.
        // Fetching also re-validates the token (kicks back to login if not).
        const codesCard = $(`<div class="card"><h2>Passcodes</h2><div id="codes" class="muted">loading…</div></div>`);
        app.append(ctrl, codesCard, scan, tools, roster, world, switchBtn(() => ls.del("mod")));
        api("/api/mod/codes", {}, T).then((c) => {
          codesCard.querySelector("#codes").outerHTML = `<div>
            <p class="muted">Read them out, or show the QR for guests to scan.</p>
            <div class="grid">
              <div class="stat"><div class="k">🎟️ Guest event code</div><div class="v" style="letter-spacing:2px">${c.eventPass}</div></div>
              <div class="stat"><div class="k">🎭 Performer passcode</div><div class="v" style="letter-spacing:2px">${c.primePass}</div></div>
            </div>
            <div class="stat" style="margin-top:10px"><div class="k">🛡️ Moderator passcode <span class="muted">— for a co-moderator</span></div><div class="v" style="letter-spacing:2px">${c.modPass}</div></div>
            <div class="qr"><img alt="Join QR" src="/api/qr?text=${encodeURIComponent(c.joinUrl + "/?code=" + c.eventPass)}" /></div>
            <p class="muted" style="text-align:center">Guests scan to open <b>${c.joinUrl}</b> with the event code filled in.</p>
          </div>`;
        }).catch(() => { ls.del("mod"); modFlow(); });

        function alertErr(e) { const t = $(`<div class="err">${e.message}</div>`); ctrl.append(t); setTimeout(() => t.remove(), 3000); }

        const render = (v) => {
          // Populate the "scan as" character list once the snapshot arrives.
          const sel = scan.querySelector("#mscanas");
          if (sel.options.length === 1 && v.characters && v.characters.length) {
            for (const c of v.characters) { const o = document.createElement("option"); o.value = c; o.textContent = "as " + c; sel.append(o); }
          }
          ctrl.querySelector("#phase").innerHTML =
            `Scenario <b>${v.scenario || "—"}</b> · <span class="pill ${v.phase === "open" ? "Mods" : "none"}">${v.phase}</span> · ${v.roster.length} guests · ${v.ledgerLen} events`;
          const rost = roster.querySelector("#rost");
          if (!v.roster.length) { rost.innerHTML = `<p class="muted">No guests yet.</p>`; }
          else {
            rost.innerHTML = `<table><tr><th>Name</th><th>Faction</th><th>Loc</th><th class="right">Score</th></tr>` +
              v.roster.map((r) => `<tr><td>${r.name}${r.captured ? " 🔒" : ""}<br><span class="muted">${r.id}</span></td><td>${pill(r.trueFaction)}</td><td>${r.location || "—"}</td><td class="right">${r.score}</td></tr>`).join("") + `</table>`;
          }
          world.querySelector("#wld").innerHTML =
            v.factions.map((f) => `<div style="margin-bottom:6px">${pill(f.id)} ${f.members.length} members ${f.hidden ? (f.revealed ? "· <span class='captured'>EXPOSED</span>" : "· <span class='muted'>hidden</span>") : ""}</div>`).join("") +
            `<div style="height:8px"></div>` +
            v.locations.map((l) => `<div class="muted">${l.label || l.id}${l.prison ? " (prison)" : ""}: ${l.occupants.length}</div>`).join("");
        };
        stream("mod", "", { snapshot: render, reveal: () => {} });
      }

      // boot — resume the last role if any
      const g = ls.get("guest"), p = ls.get("prime"), m = ls.get("mod");
      if (g && g.id) guestFlow(); else if (p && p.token) primeFlow(); else if (m && m.token) modFlow(); else chooser();
    </script>
  </body>
</html>
