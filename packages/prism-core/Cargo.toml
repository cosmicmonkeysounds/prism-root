[package]
name = "prism-core"
version = "0.1.0"
edition = "2021"
description = "Prism Framework core — shared types, state machines, design tokens, and the CRDT-backed object model. Target of the Phase 2 full port from the legacy TypeScript @prism/core package."

[lib]
name = "prism_core"
path = "src/lib.rs"

[features]
default = []
# Pulled in by host crates that actually run the CRDT layer. Off for
# pure-logic consumers (design tokens, shell mode, puck-JSON parsing)
# so they don't drag loro into their dependency tree.
crdt = ["dep:loro"]
# Phase 1 of `docs/dev/luau-integration-plan.md`. Off by default so
# pure-logic consumers don't drag mlua's vendored Luau build into their
# dependency tree. The `#[luau_expose]` annotations themselves live in
# the source unconditionally — only the generated `mlua::UserData` /
# `IntoLua` / `FromLua` impls are gated on this feature. The Luau type
# stub constants (`LUAU_TYPE_DEF` / `LUAU_TYPE_NAME`) are always
# emitted so the codegen subcommand can scrape them without flipping
# the feature on.
luau = ["dep:mlua"]

[dependencies]
# Proc macro that turns `#[luau_expose]` into `mlua::UserData` impls +
# `LUAU_TYPE_DEF` constants. Always pulled in (the macro itself is
# zero-cost when not invoked); the `mlua` runtime side only compiles
# when the `luau` feature is on.
prism-luau-derive = { workspace = true }
mlua = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
slotmap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
full_moon = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
glam = { workspace = true }
loro = { workspace = true, optional = true }
ropey = { workspace = true }
rrule = { workspace = true }
chrono-tz = { workspace = true }
rust_decimal = { workspace = true }
rusty-money = { workspace = true }
financial = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
