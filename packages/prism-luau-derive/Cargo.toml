[package]
name = "prism-luau-derive"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Proc-macro crate for Prism — derives mlua UserData impls and Luau type stubs from the same Rust source. Phase 1 of docs/dev/luau-integration-plan.md."

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
