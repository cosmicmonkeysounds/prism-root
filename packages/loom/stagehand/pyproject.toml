[project]
name = "loom-stagehand"
version = "0.1.0"
description = "Show-control bridge for Loom live events: the story's SSE feed becomes OSC/MQTT cues; MQTT sensors become journaled story signals."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "httpx>=0.27",
    "paho-mqtt>=2.0",
    "python-osc>=1.8",
    "PyYAML>=6.0",
]

[project.scripts]
stagehand = "stagehand.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stagehand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
