[package]
name = "loom-wasm"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "wasm-bindgen surface for loom-parser — exposes parse() to the Loom web editor for live syntax highlighting and diagnostics."

[lib]
name = "loom_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
loom-parser = { path = "../parser" }
# `default-features = false` on loom-lsp drops the `stdio`
# JSON-RPC pump — the browser editor calls `Workspace::*` directly
# through the wasm-bindgen wrappers in `lsp_workspace.rs`.
loom-lsp = { path = "../lsp", default-features = false }
# `default-features = false` on loom-runtime drops the Luau bridge.
# mluau requires `wasm32-unknown-emscripten`, which is incompatible
# with our wasm-bindgen pipeline. The stub `LuauRegistry` reports
# `UnknownKind` for any non-builtin directive. See
# `docs/dev/loom-web-shipping.md` §7.
loom-runtime = { path = "../runtime", default-features = false }
loom-syntax = { path = "../syntax" }
lsp-types = { workspace = true }
loro = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { workspace = true }

# `getrandom` and `uuid` are pulled in transitively through prism-core
# (loom-parser/loom-runtime depend on it). On wasm32-unknown-unknown
# both need their `js` feature flag enabled so they know how to source
# entropy from the host — without it the build errors with
# `use of unresolved module or unlinked crate 'imp'`. We activate
# them here at the wasm leaf so unrelated crates aren't forced to
# carry the feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }
uuid = { workspace = true, features = ["js"] }

# Disable wasm-pack's post-build wasm-opt pass — the bundled binary
# fails to validate the output on macOS aarch64 with a bind error in
# generational-box (transitive via prism-core). The unoptimized wasm
# is ~2.2× larger but still under the editor's bundle budget, and
# the parser tokens/diagnostics path is not on a hot loop.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

