[workspace]
resolver = "2"
members = [
    "packages/prism-daemon",
    "packages/prism-core",
    "packages/prism-builder",
    "packages/prism-shell",
    "packages/prism-studio/src-tauri",
    "packages/prism-cli",
    "packages/prism-relay",
    "packages/prism-dock",
    "packages/prism-luau-derive",
    # Slint→Taffy migration (ADR-008, with the 2026-05-04 Clay→Taffy
    # pivot — see the top of `docs/dev/clay-migration-plan.md`). New
    # crates ship under `MIT OR Apache-2.0` to mark the licence
    # boundary; existing crates stay on GPL until Phase 5 cutover.
    "packages/prism-ui-runtime",
    "packages/prism-ui-build",
]

# Shared package metadata — every crate opts in to `license` via
# `license.workspace = true`. The Prism codebase is GPL-3.0-or-later;
# that choice is load-bearing for the Slint dependency, which ships
# under GPLv3 + optional commercial. See the decision log in
# `docs/dev/slint-migration-plan.md` (2026-04-15 Clay → Slint pivot).
[workspace.package]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Single versioned source of truth for deps every crate uses. Bumping
# here propagates to every member via `workspace = true`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
postcard = { version = "1", features = ["alloc"] }
# Local IPC transport for the daemon sidecar channel. Unix domain
# sockets on Linux/macOS, named pipes on Windows — both hidden behind
# one trait. Length-prefixed `postcard` frames ride on top.
interprocess = "2"
loro = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util"] }

# Filesystem watcher. `prism-daemon::watcher_module` and `prism-cli::watch`
# both ride on this crate — the former exposes it as an IPC command, the
# latter drives the Phase 1 notify-driven dev-server scaffold (§11 of
# `docs/dev/slint-migration-plan.md`). Single workspace pin so daemon +
# CLI can't drift.
notify = "7"

# HTTP stack for `prism-relay` (Sovereign Portal SSR) and `prism-daemon`'s
# `transport-http` feature. axum is the idiomatic Rust web framework and
# is already proven inside the daemon's HTTP adapter — pinning it at the
# workspace level so both crates track the same version. `tower` /
# `tower-http` carry the middleware stack (tracing, compression, CORS,
# request limits) every HTTP-serving crate needs. Resolved by the Relay
# rewrite decision (2026-04-15).
axum = { version = "0.7", default-features = false, features = ["json", "http1", "tokio", "matched-path", "query", "form", "ws"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["trace", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

# UI toolkit — `prism-ui-runtime` owns the declarative UI language
# (`.prism-ui` files) and the render + windowing stack via winit +
# femtovg native and wasm32-unknown-unknown + webgl on the web. Slint
# is fully retired (Phase 5 cutover, 2026-05-10). See
# `docs/dev/clay-migration-plan.md` for the migration history.

# 2D math — SIMD-accelerated Vec2/Affine2/Mat3 for the builder's
# transform system (ADR-003). Works on native + WASM.
glam = { version = "0.29", features = ["serde"] }
# CSS Grid + Flexbox + Block layout engine (ADR-003). Trait-based —
# composes with our own document tree. Used by Slint, Bevy, Dioxus.
taffy = "0.7"

# Direct GPU/text dependencies for `prism-ui-runtime`'s native +
# web backends (Phase 1 of the Slint→Taffy migration —
# `docs/dev/clay-migration-plan.md` §5.3). These are pulled directly
# now that the Slint-bundled versions are on the way out; matching
# the versions Slint already had transitively keeps the toolchain
# stable through the cutover. `cosmic-text` does shaping + glyph
# rasterization (replaces the heuristic measure callback); `femtovg`
# is the GL-backed 2D canvas; `glutin`/`glutin-winit` give us a GL
# context for winit on desktop; `raw-window-handle` is the shared
# windowing ABI both layers speak.
winit = { version = "0.30" }
femtovg = { version = "0.23", default-features = false, features = ["image-loading"] }
glutin = { version = "0.32" }
glutin-winit = { version = "0.5" }
raw-window-handle = { version = "0.6" }
cosmic-text = { version = "0.12" }

# State + data structures.
slotmap = "1"
indexmap = { version = "2", features = ["serde"] }
imbl = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
regex = "1"
ropey = "1.6"
full_moon = { version = "2", features = ["luau"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["getrandom", "static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# Financial / calendar crates recommended by flux-port-gap-analysis.md.
rrule = "0.13"
chrono-tz = "0.10"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rusty-money = { version = "0.4", features = ["iso"] }
financial = "1"

# WASM glue — used by `prism-shell`'s web target (Slint on
# wasm32-unknown-unknown). The crate compiles to a wasm-bindgen
# module that `web/index.html` loads directly; no emscripten is
# involved on the shell side. The daemon still uses
# wasm32-unknown-emscripten for its Luau C core — that target is
# orthogonal and untouched by the Slint pivot.
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = "0.2"

# Image processing — screenshot comparison in `prism-shell`'s e2e test
# framework. Loads PNG screenshots, compares pixel-by-pixel, generates
# visual diff images highlighting regressions.
image = { version = "0.25", default-features = false, features = ["png"] }

# Native file dialog — opens the OS file picker so the shell can
# browse for images, documents, and other binary assets without a
# custom file-chooser widget. Native-only (no WASM support).
rfd = "0.15"

# OS-level input simulation — injects real keyboard/mouse events
# through the platform's accessibility layer so e2e tests exercise the
# full input pipeline (winit → Slint → InputManager). Optional:
# callback-level testing works without it.
enigo = { version = "0.2", default-features = false }

# Luau scripting runtime. Pinned at the workspace level so the daemon
# (the only crate that *runs* Luau today) and any crate that *exposes*
# types to Luau via `#[luau_expose]` (the derive macro pulls in mlua's
# trait surface) track the same version. Phase 1 of
# `docs/dev/luau-integration-plan.md` lifted this here from the daemon
# manifest because `prism-core` now needs the trait imports too.
mlua = { version = "0.10", features = ["luau", "vendored", "serialize"] }
# In-tree proc macro that derives `mlua::UserData` impls + `.d.luau`
# type stubs from a single Rust source. Annotated leaf-first across the
# workspace so the Luau type surface stays in lockstep with Rust.
prism-luau-derive = { path = "packages/prism-luau-derive" }

# Dev-only.
insta = "1"
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
